plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.example'
base { archivesName = 'alienskins' }

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Simple Voice Chat API: only needed to compile. The player's own Simple Voice Chat provides it at runtime.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.+"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
